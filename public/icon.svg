<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Slate Luxury -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Amber Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Teal Accent -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Base: Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="170" fill="#f59e0b" opacity="0.12" filter="blur(40px)" />

  <!-- Elegant Clean Minimalist Portfolio / Folder Silhouette -->
  <g filter="url(#softShadow)">
    <!-- Back Tab of the Folder -->
    <path d="M120 180 
             C120 162 134 148 152 148 
             L224 148 
             L260 180 
             L360 180 
             C378 180 392 194 392 212 
             L392 230 
             L120 230 Z" 
          fill="#b45309" />

    <!-- Crisp Document Accent Sheet inside Folder -->
    <rect x="156" y="184" width="200" height="90" rx="14" fill="#ffffff" opacity="0.95" />
    <line x1="186" y1="214" x2="280" y2="214" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <line x1="186" y1="234" x2="240" y2="234" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />

    <!-- Front Folder Main Body (Simple, Bold, Curved) -->
    <path d="M108 226 
             C108 206 124 190 144 190 
             L230 190 
             L264 216 
             L368 216 
             C388 216 404 232 404 252 
             L404 354 
             C404 374 388 390 368 390 
             L144 390 
             C124 390 108 374 108 354 Z" 
          fill="url(#goldGrad)" />

    <!-- Smart Green Security / Sync Badge (Minimalist Touch) -->
    <circle cx="346" cy="336" r="28" fill="#0f172a" />
    <circle cx="346" cy="336" r="22" fill="url(#emeraldGrad)" />
    <!-- Checkmark inside badge -->
    <path d="M338 336 L344 342 L356 330" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
